{{ define "main" }}
  <div class="shell page-shell">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="{{ .Site.Home.RelPermalink }}">Topics</a>
      <span aria-hidden="true">/</span>
      <span>{{ .Title }}</span>
    </nav>

    <header class="section-intro">
      <h1>{{ .Title }}</h1>
      <p>{{ .Description }}</p>
    </header>

    <ul class="post-list">
      {{ range .RegularPages.ByWeight }}
        <li>
          <time class="post-meta" datetime="{{ .Date.Format "2006-01-02" }}">[{{ .Date.Format "2006-01-02" }}]</time>
          <a class="post-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
        </li>
      {{ end }}
    </ul>
  </div>
{{ end }}
